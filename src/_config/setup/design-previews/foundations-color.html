<!-- @dsCard group="Foundations" -->
<!doctype html>
<html lang="en" data-theme="light">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Color tokens</title>
		<link rel="stylesheet" href="../jedee.css" />
		<style>
			.ds-page {
				padding: var(--space-l);
			}
			.ds-swatches {
				display: grid;
				grid-template-columns: repeat(auto-fill, minmax(11rem, 1fr));
				gap: var(--space-s);
				list-style: none;
				padding: 0;
			}
			.ds-swatch {
				display: grid;
				gap: var(--space-3xs);
			}
			.ds-chip {
				block-size: 4rem;
				border-radius: var(--border-radius-medium);
				border: 1px solid var(--color-bg-accent-2);
			}
			.ds-name {
				font-family: var(--font-mono, monospace);
				font-size: var(--size-step-min-2);
				word-break: break-all;
			}
			.ds-value {
				font-family: var(--font-mono, monospace);
				font-size: var(--size-step-min-2);
				color: var(--color-text-accent);
			}
		</style>
	</head>
	<body>
		<main class="ds-page flow">
			<div class="repel">
				<h1 class="text-step-3">Color tokens</h1>
				<button class="button" data-small-button type="button" id="theme">Dark theme</button>
			</div>
			<p>Read live from <code>jedee.css</code> — this page has no token list of its own, so it cannot go stale.</p>

			<h2 class="text-step-1">Semantic</h2>
			<ul class="ds-swatches" role="list" id="semantic"></ul>

			<h2 class="text-step-1">Palette</h2>
			<ul class="ds-swatches" role="list" id="palette"></ul>
		</main>

		<script>
			// Walk grouping rules too: the site's custom properties sit inside @layer, whose rules are not on the top-level list.
			const collect = (rules, out) => {
				for (const rule of rules) {
					if (rule.cssRules) collect(rule.cssRules, out);
					if (rule.selectorText?.split(',').some(s => s.trim().startsWith(':root'))) {
						// --color-border-height is a length that shares the --color- prefix; a swatch of it would be blank.
						for (const prop of rule.style) if (prop.startsWith('--color-') && !/^\s*[\d.]+(px|rem|em)\s*$/.test(rule.style.getPropertyValue(prop))) out.add(prop);
					}
				}
				return out;
			};

			const names = new Set();
			for (const sheet of document.styleSheets) {
				try {
					collect(sheet.cssRules, names);
				} catch {
					/* a cross-origin sheet cannot be read; the site's own can */
				}
			}

			const root = getComputedStyle(document.documentElement);
			const isPalette = name => /-\d{3}$/.test(name) || /-(vivid|subdued)$/.test(name);

			const render = () => {
				const computed = getComputedStyle(document.documentElement);
				for (const [id, test] of [
					['semantic', n => !isPalette(n)],
					['palette', isPalette]
				]) {
					document.getElementById(id).innerHTML = [...names]
						.filter(test)
						.sort()
						.map(
							n =>
								`<li class="ds-swatch"><div class="ds-chip" style="background:var(${n})"></div><span class="ds-name">${n}</span><span class="ds-value">${computed.getPropertyValue(n).trim()}</span></li>`
						)
						.join('');
				}
			};

			render();
			document.getElementById('theme').addEventListener('click', e => {
				const dark = document.documentElement.dataset.theme === 'dark';
				document.documentElement.dataset.theme = dark ? 'light' : 'dark';
				e.target.textContent = dark ? 'Dark theme' : 'Light theme';
				render();
			});
		</script>
	</body>
</html>
