<!-- @dsCard group="Foundations" -->
<!doctype html>
<html lang="en" data-theme="light">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Color tokens</title>
		<link rel="stylesheet" href="../jedee.css" />
		<style>
			.ds-page {
				padding: var(--space-l);
			}
			.ds-swatches {
				display: grid;
				grid-template-columns: repeat(auto-fill, minmax(11rem, 1fr));
				gap: var(--space-s);
				list-style: none;
				padding: 0;
			}
			.ds-swatch {
				display: grid;
				gap: var(--space-3xs);
			}
			.ds-chip {
				block-size: 4rem;
				border-radius: var(--border-radius-medium);
				border: 1px solid var(--color-bg-accent-2);
			}
			.ds-name {
				font-family: var(--font-mono, monospace);
				font-size: var(--size-step-min-2);
				word-break: break-all;
			}
			.ds-value {
				font-family: var(--font-mono, monospace);
				font-size: var(--size-step-min-2);
				color: var(--color-text-accent);
			}
		</style>
	</head>
	<body>
		<main class="ds-page flow">
			<div class="repel">
				<h1 class="text-step-3">Color tokens</h1>
				<button class="button" data-small-button type="button" id="theme">Dark theme</button>
			</div>
			<p>Token names come from <code>jedee.css</code> when the bundle is built; every value below is read from the live stylesheet, so the theme toggle shows the real pair.</p>

			<h2 class="text-step-1">Semantic</h2>
			<ul class="ds-swatches" role="list" id="semantic"></ul>

			<h2 class="text-step-1">Palette</h2>
			<ul class="ds-swatches" role="list" id="palette"></ul>
		</main>

		<script>
			// Names are baked in by the bundler; the values below are still read live, so a theme switch is honest.
			const declared = /*@tokens:--color-*/;

			// A name may be declared inside a block rather than on :root, or be a length sharing the --color- prefix; neither belongs in a swatch grid.
			const probe = getComputedStyle(document.documentElement);
			const names = declared.filter(n => {
				const v = probe.getPropertyValue(n).trim();
				return v && !/^[\d.]+(px|rem|em)$/.test(v);
			});

			const isPalette = name => /-\d{3}$/.test(name) || /-(vivid|subdued)$/.test(name);

			const render = () => {
				const computed = getComputedStyle(document.documentElement);
				for (const [id, test] of [
					['semantic', n => !isPalette(n)],
					['palette', isPalette]
				]) {
					document.getElementById(id).innerHTML = [...names]
						.filter(test)
						.sort()
						.map(
							n =>
								`<li class="ds-swatch"><div class="ds-chip" style="background:var(${n})"></div><span class="ds-name">${n}</span><span class="ds-value">${computed.getPropertyValue(n).trim()}</span></li>`
						)
						.join('');
				}
			};

			render();
			document.getElementById('theme').addEventListener('click', e => {
				const dark = document.documentElement.dataset.theme === 'dark';
				document.documentElement.dataset.theme = dark ? 'light' : 'dark';
				e.target.textContent = dark ? 'Dark theme' : 'Light theme';
				render();
			});
		</script>
	</body>
</html>
