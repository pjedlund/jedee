<!-- @dsCard group="Foundations" -->
<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Space scale</title>
		<link rel="stylesheet" href="../jedee.css" />
		<style>
			.ds-page {
				padding: var(--space-l);
			}
			.ds-row {
				display: grid;
				grid-template-columns: minmax(12rem, auto) 1fr;
				align-items: center;
				gap: var(--space-s);
				padding-block: var(--space-3xs);
			}
			.ds-meta {
				font-family: var(--font-mono, monospace);
				font-size: var(--size-step-min-2);
				color: var(--color-text-accent);
			}
			.ds-bar {
				block-size: 1.25rem;
				background: var(--color-accent-orange);
				border-radius: var(--border-radius-small);
			}
		</style>
	</head>
	<body>
		<main class="ds-page flow">
			<h1 class="text-step-3">Space scale</h1>
			<p>Utopia steps and fluid pairs, read live from <code>jedee.css</code>. The fluid pairs grow as the frame widens; the fixed steps do not.</p>

			<h2 class="text-step-1">Steps</h2>
			<div id="steps"></div>

			<h2 class="text-step-1">Fluid pairs</h2>
			<div id="pairs"></div>
		</main>

		<script>
			// Walk grouping rules too: the site's custom properties sit inside @layer, whose rules are not on the top-level list.
			const collect = (rules, out) => {
				for (const rule of rules) {
					if (rule.cssRules) collect(rule.cssRules, out);
					if (rule.selectorText?.split(',').some(s => s.trim().startsWith(':root'))) {
						for (const prop of rule.style) if (prop.startsWith('--space-')) out.add(prop);
					}
				}
				return out;
			};

			const names = new Set();
			for (const sheet of document.styleSheets) {
				try {
					collect(sheet.cssRules, names);
				} catch {
					/* a cross-origin sheet cannot be read; the site's own can */
				}
			}

			const computed = getComputedStyle(document.documentElement);
			// A custom property computes to its declared text, so a clamp() reads as "clamp(...)". Resolving it needs a real element to apply it to.
			const probe = document.createElement('div');
			probe.style.cssText = 'position:absolute;visibility:hidden;inline-size:max-content';
			document.body.append(probe);
			const px = name => {
				probe.style.inlineSize = `var(${name})`;
				return parseFloat(getComputedStyle(probe).inlineSize);
			};
			const row = n =>
				`<div class="ds-row"><span class="ds-meta">${n} — ${px(n).toFixed(0)}px</span><div class="ds-bar" style="inline-size:var(${n})"></div></div>`;

			// A pair carries two size words (space-l-xl); a step carries one.
			const isPair = n => n.replace('--space-', '').includes('-') && /-(3xs|2xs|xs|s|m|l|xl|2xl|3xl)$/.test(n);

			const all = [...names].sort((a, b) => px(a) - px(b));
			document.getElementById('steps').innerHTML = all.filter(n => !isPair(n)).map(row).join('');
			document.getElementById('pairs').innerHTML = all.filter(isPair).map(row).join('');
		</script>
	</body>
</html>
