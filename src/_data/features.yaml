# The wiki dial. Three working positions:
#   private (default) — the wiki is fully ignored; nothing builds, anywhere.
#   local — the wiki builds to /wiki/… pages, but ONLY in the dev server (npm start). A production build (npm run build) always ignores it, so the published site stays wiki-free whatever this says. Flip here to read it.
#   public — the wiki builds everywhere, production included: this is how it goes fully live.
#   hidden — reserved (_local/design/Plan - LLM wiki (private-first).md §6); flipping to it stops the build with a clear message instead of half-working.
wiki:
  visibility: public   # private | local | public   (hidden reserved)

# The search dial. `enabled: false` removes /search.json, the header magnifier, and the CSS and JS that ride along with the partial.
search:
  enabled: true
  # Collection keys, SINGULAR — `article`, not `articles`. Plurals are archive URLs and produce an empty index with a green build.
  types: [article, note, reading, watching, jam, photo, recipe, event, audio, video, activity, searchable]
  # Optional per-type narrowing: frontmatter key -> required value. A type absent here is indexed whole.
  only:
    activity:
      activityType: orienteering
