[[plugins]]
package = "netlify-plugin-cache"
  [plugins.inputs]
  # .cache = the eleventy-fetch cache (remote cover images, webmentions). dist/assets/images = eleventy-img's optimized LOCAL output (activity race-map scans, photos): v7 skips the sharp work whenever the target file already exists on disk, so persisting this folder across deploys avoids re-optimizing ~83 MB of unchanged maps on every build. This only helps because the build below no longer wipes dist first — see the [build] command.
  paths = [ ".cache", "dist/assets/images", "dist/img" ]

[[headers]]
for = "/*"
[headers.values]
  Content-Security-Policy = "upgrade-insecure-requests;"
  X-Content-Type-Options = "nosniff"
  X-Frame-Options = "DENY"
  Referrer-Policy = "strict-origin-when-cross-origin"
  # ⚠ autoplay must list YouTube's origins, plus self (Chrome only delegates what the page holds), or Chrome ignores the facade's click and every embed needs a second click.
  Permissions-Policy = "autoplay=(self \"https://www.youtube.com\" \"https://www.youtube-nocookie.com\"), camera=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), publickey-credentials-get=()"

[[headers]]
for = "*.woff2"
[headers.values]
  Cache-Control = "max-age=31536000,public,must-revalidate"

# /img/ (eleventy-img transform) and /bundle/ filenames change with their content, so a year-long immutable cache is safe here — unlike /assets/images/, whose names don't.
[[headers]]
for = "/img/*"
[headers.values]
  Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "/bundle/*"
[headers.values]
  Cache-Control = "public, max-age=31536000, immutable"

# Component scripts are built to STABLE, unhashed filenames (build-js.js -> dist/assets/scripts/components/<name>.js) and referenced unhashed in the .webc components, so a long cache leaves returning visitors on an old copy after any change to one (the route-line place-map update hit exactly this). Revalidate on every load instead: the ETag makes an unchanged file a cheap 304, and these scripts load lazily on idle so the conditional request isn't on the critical path. If these ever get content-hashed filenames, restore the 1-year immutable cache.
[[headers]]
for = "/assets/scripts/components/*.js"
[headers.values]
  Cache-Control = "max-age=0,public,must-revalidate"

[build]
  # build:11ty, NOT the full `build` script: `build` runs `clean` (rimraf dist) first, which would delete the image cache netlify-plugin-cache just restored. Netlify checks out a fresh tree each deploy, so there's no stale local dist to clean anyway — clean only matters for repeated LOCAL builds.
  # ⚠ Netlify keeps dist/ between builds, so empty it except the two image caches, or deleted pages stay live and a stale dist/netlify.toml overrides the header rules.
  command = "mkdir -p dist/assets && find dist -mindepth 1 -maxdepth 1 ! -name assets ! -name img -exec rm -rf {} + && find dist/assets -mindepth 1 -maxdepth 1 ! -name images -exec rm -rf {} + && npm run build:11ty"
  publish = "dist"

# Secrets scanning: the photo static-map fetch (Geoapify) puts MAP_API_KEY in the request URL, and eleventy-fetch caches that URL verbatim under .cache/ (persisted across builds by netlify-plugin-cache above). The deployed output never contains the key, but Netlify scans build-generated files — so exclude the non-deployed cache, else the key trips Smart Detection / a secret-marked var fails the deploy. MAP_API_KEY itself stays in the Netlify UI (Builds scope), NOT here — this file is committed to git.
[build.environment]
  SECRETS_SCAN_OMIT_PATHS = ".cache/**"

# Micropub server lives in netlify/functions/micropub.js and self-routes to /api/micropub via its `export const config = { path }` (Functions v2). esbuild bundles the function with its npm deps (@benjifs/micropub, github-store, gray-matter). The Eleventy build ignores netlify/ (input dir is src/).
[functions]
  node_bundler = "esbuild"
