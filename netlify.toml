[[plugins]]
package = "netlify-plugin-cache"
  [plugins.inputs]
  paths = [ ".cache" ]

[[headers]]
for = "/*"
[headers.values]
  Content-Security-Policy = "upgrade-insecure-requests;"
  X-Content-Type-Options = "nosniff"
  X-Frame-Options = "DENY"
  X-XSS-Protection = "1; mode=block"
  Referrer-Policy = "strict-origin-when-cross-origin"
  Permissions-Policy = "autoplay=(), camera=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), publickey-credentials-get=()"

[[headers]]
for = "*.woff2"
[headers.values]
  Cache-Control = "max-age=31536000,public,must-revalidate"

[[headers]]
for = "/assets/scripts/components/*.js"
[headers.values]
  Cache-Control = "max-age=31536000,public,must-revalidate"

[build]
  command = "npm run build"
  publish = "dist"

# Micropub server lives in netlify/functions/micropub.js and self-routes to
# /api/micropub via its `export const config = { path }` (Functions v2). esbuild
# bundles the function with its npm deps (@benjifs/micropub, github-store,
# gray-matter). The Eleventy build ignores netlify/ (input dir is src/).
[functions]
  node_bundler = "esbuild"
